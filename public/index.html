<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Herbal Product</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top-bar">
    <div class="top-inner">
      <a class="brand" href="/" aria-label="Home">
        <svg class="leaf" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c0-9 5-14 15-14 0 10-5 15-14 15-.6 0-1-.4-1-1z"/><path d="M5 19c3-4 6-7 9-9" /></svg>
        <span class="site-name" id="site-name"></span>
      </a>
      <p class="tagline" id="tagline"></p>
    </div>
  </header>

  <main>
    <div id="blocks"></div>

    <section class="order" id="order">
      <h2 id="order-title"></h2>
      <form id="order-form">
        <div class="grid-2">
          <label>Full name
            <input name="name" required maxlength="100" autocomplete="name">
          </label>
          <label>Phone number
            <input name="phone" required maxlength="30" autocomplete="tel" placeholder="+260...">
          </label>
        </div>
        <label>Delivery address
          <input name="address" required maxlength="300" autocomplete="street-address">
        </label>
        <div class="grid-2">
          <label>Product
            <select name="product" id="product-select"></select>
          </label>
          <label>Quantity
            <input name="quantity" type="number" min="1" max="999" value="1" required>
          </label>
        </div>
        <label>Note (optional)
          <textarea name="note" rows="3" maxlength="500"></textarea>
        </label>
        <button type="submit" id="order-button"></button>
        <p id="order-message" class="message" role="status"></p>
      </form>
    </section>

    <section class="closing" id="closing-text"></section>
  </main>

  <footer class="site-footer">
    <p class="footer-text" id="footer-text"></p>
    <p class="footer-text" id="footer-contact"></p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
