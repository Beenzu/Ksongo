<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Herbal Product</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site-header">
    <span class="site-name" id="site-name"></span>
  </header>

  <main>
    <div id="blocks"></div>

    <section class="order" id="order">
      <h2 id="order-title"></h2>
      <form id="order-form">
        <label>Full name
          <input name="name" required maxlength="100" autocomplete="name">
        </label>
        <label>Phone number
          <input name="phone" required maxlength="30" autocomplete="tel" placeholder="+260...">
        </label>
        <label>Delivery address
          <input name="address" required maxlength="300" autocomplete="street-address">
        </label>
        <label>Product
          <select name="product" id="product-select"></select>
        </label>
        <label>Quantity
          <input name="quantity" type="number" min="1" max="999" value="1" required>
        </label>
        <label>Note (optional)
          <textarea name="note" rows="3" maxlength="500"></textarea>
        </label>
        <button type="submit" id="order-button"></button>
        <p id="order-message" class="message" role="status"></p>
      </form>
    </section>

    <section class="closing text" id="closing-text"></section>
  </main>

  <footer class="site-footer">
    <p class="text" id="footer-text"></p>
    <p class="text" id="footer-contact"></p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
